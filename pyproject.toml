[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urlreporter"
version = "1.0.5"
description = "CLI tool that aggregates public security scanners into one report for a URL."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Paolo" }]
# Matches the source pyproject's ceiling on httpx. The CLI tree ships no
# fastapi/starlette, so those bounds don't apply here - but every scanner is
# built on httpx, and httpx2 already ships at 2.x as a separate package.
dependencies = [
    "httpx>=0.27,<1",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
urlreporter = "urlreporter.cli:main"

[tool.setuptools.packages.find]
include = ["urlreporter*"]
